<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GNN HybridRAG Research Assistant</title>

  <link rel="stylesheet" href="styles.css">

  <!-- KaTeX：数学公式样式 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  >
</head>

<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">Knowledge Engineering Practice</p>
        <h1>GNN HybridRAG Research Assistant</h1>
        <p class="muted">面向图神经网络科研论文的 HybridRAG 智能问答系统</p>
      </div>

      <div class="status">
        <span id="dot"></span>
        <span id="healthText">检查后端...</span>
      </div>
    </header>

    <section class="grid">

      <div class="card">
        <h2>科研问题</h2>

        <textarea
          id="query"
          placeholder="例如：VGAE 和 GCN 有什么关系？"
        ></textarea>

        <div class="examples">
          <button data-q="VGAE 和 GCN 有什么关系？">
            VGAE 与 GCN
          </button>

          <button data-q="哪些使用 GCN 的模型被用于 Link Prediction？">
            多跳关系
          </button>

          <button data-q="比较 GCN、GAT 和 GraphSAGE 的主要区别。">
            模型比较
          </button>
        </div>

        <div class="modes">
          <label>
            <input type="radio" name="mode" value="vector">
            Vector
          </label>

          <label>
            <input type="radio" name="mode" value="graph">
            Graph
          </label>

          <label>
            <input type="radio" name="mode" value="hybrid" checked>
            Hybrid
          </label>
        </div>

        <button id="ask" class="primary">
          开始提问
        </button>

        <p id="error" class="error hidden"></p>
      </div>


      <div class="card">
        <div class="title-row">
          <h2>生成答案</h2>
          <span id="badge">HYBRID</span>
        </div>

        <div id="answer" class="answer muted">
          提交问题后，这里显示 LLM 的回答。
        </div>
      </div>


      <div class="card wide">
        <h2>检索证据</h2>

        <div class="tabs">
          <button class="tab active" data-tab="vector">
            Vector Evidence
          </button>

          <button class="tab" data-tab="graph">
            Graph Evidence
          </button>

          <button class="tab" data-tab="references">
            References
          </button>
        </div>

        <div id="vector" class="panel active"></div>
        <div id="graph" class="panel"></div>
        <div id="references" class="panel"></div>
      </div>

    </section>
  </main>


  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- HTML 安全过滤 -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <!-- KaTeX -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js">
  </script>

  <!-- KaTeX 自动公式识别 -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js">
  </script>

  <script src="app.js"></script>
</body>
</html>
